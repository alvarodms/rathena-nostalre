###########################################################################
# Population Engine Party Database (nostalRE)
###########################################################################
#
# Shells that play as a party, on the maps listed here. A party is a tactic and its slots;
# a map entry says which parties the map holds. Switch: population_engine_parties.
#
# A party takes its members out of the map's shells (db/population_spawn.yml): as the map
# fills, the spawner gives shells to the parties until they are full. A party on a map with
# few shells stays short of members.
#
#   - Party:         Name.
#     Tactic:        camp -- a leader on a spot of the map, the party around them. (Default: camp)
#     Camp:          { Radius: cells from the camp spot its members stand within (Default: 4),
#                      Defend: members at the camp fight monsters attacking a member this close
#                              to it, and nothing else (Default: 10),
#                      Sit:    members with nothing to cast sit down (Default: true) }
#     Recruit:       Chat room titles for the leader. {map} is the map's name, {level} the
#                    party's lowest level rounded down to a five. (Default: none)
#     RecruitChance: Percent of parties whose leader opens one. A leader in a chat room casts
#                    nothing, so their party has a support. (Default: 0)
#     Respawn:       [min, max] seconds a member killed out of the healer's sight lies there
#                    before it gets up at the camp, as a player back from town. One killed in
#                    the healer's sight waits for Resurrection instead. (Default: [15, 30])
#     Slots:         The places in the party, each with a duty:
#       - Duty:      anchor    -- the leader, on the camp spot. One per party (the first anchor
#                                 slot). A leader who heals and has no chat room is its
#                                 party's support as well.
#                    support   -- stays by the leader; its heals, buffs and Resurrection are
#                                 for the party's members only.
#                    roamer    -- hunts around the camp, comes back to be healed and buffed,
#                                 leaves again.
#                    performer -- a Bard or Dancer at the camp, with Partner on the next cell
#                                 (ensembles need the two side by side).
#                    battery   -- a Professor at the camp: Soul Exchange for members low on SP.
#         Jobs:      { JobName: weight } -- names as in population_engine.yml.
#         Count:     How many, or [min, max]. (Default: 1; support: 0, raised to 1 when the
#                    leader is no support)
#         Chance:    Percent of parties that have the slot. (Default: 100)
#         Partner:   performer: the job standing next to it; the two come together or not at all.
#         SkillSet:  A Name: in population_skill_db.yml, or a list of them: each member takes
#                    the one written closest to its class (its own, then its transcendent, then
#                    its line's), so [priest_camp, acolyte_camp] serves a Priest and the Acolyte
#                    one steps down to, and a Paladin takes paladin_camp over crusader_camp. A
#                    member whose line has none keeps its own. (Default: their build's or job's)
#         PartnerSkillSet: The same for the Partner.
#         Build:     A Build: in population_personality.yml, or a list: each member takes the
#                    first that is for its class. (Default: rolled)
#         roamers only:
#         Roam:      Cells from the camp it hunts within, or map: anywhere on the map. A
#                    temperament's Leash holds it nearer (population_personality.yml).
#                    (Default: 40)
#         Return:    { HpBelow: 40, SpBelow: 15, Unbuffed: true, After: [min, max] } -- it goes
#                    back to the camp below this % HP at once, and once its fight is over below
#                    this % SP, when Blessing and Increase Agility it left with have run out,
#                    or after this many seconds out. (Default: as shown, no After)
#         Leave:     { HpAbove: 90, SpAbove: 60, Wait: [10, 30] } -- it leaves again from this
#                    % HP and SP, buffed when a healer is at the camp, or after waiting this
#                    many seconds. (Default: as shown)
#
#   - Map:           Map name.
#     Parties:       { PartyName: count } -- how many of each, scaled by
#                    population_engine_density_pct like the shells they are made of.
#     Camps:         [[x, y], ...] -- camp spots, taken in order. (Default: by one of the map's
#                    warps, where parties used to gather, 30 cells from the next camp)
#     Levels:        [min, max] -- the base levels of its parties. Each party takes a window
#                    of it 15 levels wide at most, so its members share EXP. (Default: from 8
#                    below the map's monster level to 7 above: Renewal gives more EXP for a
#                    monster above you, so players hunt monsters above them)
#     Chance:        { duty: percent } -- instead of the slots' Chance on this map, for maps
#                    where every party had songs or no party had a Professor.
#
# Classes fit the party's levels (population_engine_map_levels): each member rolls a level in
# its party's window, and a class it cannot be at that level gets the class below it (High
# Priest to Priest, Priest to Acolyte, Knight to Swordsman, then Novice; second classes start
# at 55), so where second classes start, some parties have them. A performer or battery slot
# is left out then, and so is a support who would be a Novice. A performer's Partner is the
# performer's level.
# @populate parties lists the parties on your map. Reload with @reloadpopenginedb; parties on
# the map keep what they were made from.
###########################################################################

Header:
  Type: POPULATION_PARTY_DB
  Version: 1

Body:

  # The leveling party of a field: the leader recruiting at the camp, a priest by them,
  # killers coming and going.
  - Party: camp_leveling
    Tactic: camp
    Camp: { Radius: 4, Defend: 10, Sit: true }
    Recruit:
      - "LF> party {map} {level}+"
      - "{map} PT {level}+ need killers"
      - "PT {level}+ heal + buffs"
      - "LF> members {map}"
    RecruitChance: 100
    Respawn: [15, 30]
    Slots:
      - Duty: anchor
        Jobs: { Priest: 4, HighPriest: 1, Knight: 2, Wizard: 1, Hunter: 1 }
        SkillSet: [priest_camp, acolyte_camp]
        Build: [priest_support, acolyte_support]
      - Duty: support
        Jobs: { Priest: 4, HighPriest: 1 }
        SkillSet: [priest_camp, acolyte_camp]
        Build: [priest_support, acolyte_support]
      - Duty: roamer
        Jobs: { Knight: 3, Hunter: 3, Wizard: 2, Assassin: 2, Crusader: 1, Monk: 1, Rogue: 1, Blacksmith: 1 }
        Count: [3, 5]
        SkillSet: [crusader_camp, paladin_camp, royal_guard_camp]
        Roam: map
        Return: { HpBelow: 45, SpBelow: 15, Unbuffed: true, After: [120, 300] }
        Leave: { HpAbove: 90, SpAbove: 60, Wait: [10, 30] }
      - Duty: performer
        Jobs: { Bard: 1 }
        Partner: Dancer
        SkillSet: bard_camp
        PartnerSkillSet: dancer_camp
        Chance: 35
      - Duty: battery
        Jobs: { Professor: 1 }
        SkillSet: professor_battery
        Chance: 25

  # The party of a first-class field: an Acolyte keeping a few killers blessed and healed.
  - Party: camp_first_job
    Tactic: camp
    Camp: { Radius: 4, Defend: 10, Sit: true }
    Recruit:
      - "LF> party {map} {level}+"
      - "PT {level}+ heal + bless"
      - "LF> members {map}"
      - "party {level}+ need dps"
    RecruitChance: 100
    Respawn: [15, 30]
    Slots:
      - Duty: anchor
        Jobs: { Acolyte: 3, Swordsman: 1, Archer: 1 }
        SkillSet: acolyte_camp
        Build: acolyte_support
      - Duty: support
        Jobs: { Acolyte: 1 }
        SkillSet: acolyte_camp
        Build: acolyte_support
      - Duty: roamer
        Jobs: { Swordsman: 2, Archer: 2, Mage: 2, Thief: 2, Merchant: 1 }
        Count: [2, 4]
        Roam: map
        Return: { HpBelow: 45, SpBelow: 15, Unbuffed: true, After: [120, 300] }
        Leave: { HpAbove: 90, SpAbove: 60, Wait: [10, 30] }

  # The party of the orc maps, where players change job: its places are second classes, and
  # the map's levels make first classes of most of them (all on Geffen Field 10).
  - Party: camp_orc
    Tactic: camp
    Camp: { Radius: 4, Defend: 10, Sit: true }
    Recruit:
      - "LF> party {map} {level}+"
      - "{map} PT {level}+ need killers"
      - "PT {level}+ heal + buffs"
      - "LF> members {map}"
    RecruitChance: 100
    Respawn: [15, 30]
    Slots:
      - Duty: anchor
        Jobs: { Priest: 3, Knight: 1 }
        SkillSet: [priest_camp, acolyte_camp]
        Build: [priest_support, acolyte_support]
      - Duty: support
        Jobs: { Priest: 1 }
        SkillSet: [priest_camp, acolyte_camp]
        Build: [priest_support, acolyte_support]
      - Duty: roamer
        Jobs: { Knight: 2, Crusader: 2, Hunter: 2, Wizard: 2, Assassin: 1, Blacksmith: 1, Monk: 1 }
        Count: [3, 4]
        SkillSet: [crusader_camp, paladin_camp, royal_guard_camp]
        Roam: map
        Return: { HpBelow: 45, SpBelow: 15, Unbuffed: true, After: [120, 300] }
        Leave: { HpAbove: 90, SpAbove: 60, Wait: [10, 30] }
      - Duty: performer
        Jobs: { Bard: 1 }
        Partner: Dancer
        SkillSet: bard_camp
        PartnerSkillSet: dancer_camp
        Chance: 10

###########################################################################
# Maps
###########################################################################

  # Payon Field 08 (Spores, Wormtails, Boas): first classes, from 10 to 25.
  - Map: pay_fild08
    Parties: { camp_first_job: 1 }

  # Payon Field 09 (Horns, Cocos, Elder Willows): first classes, from 25 to 40.
  - Map: pay_fild09
    Parties: { camp_first_job: 2 }

  # Geffen Field 10 (Orc Warriors, Orc Ladies): first classes close to their job change.
  - Map: gef_fild10
    Parties: { camp_orc: 2 }
    Levels: [35, 52]

  # Orc Dungeon 1 (Orc Zombies, Orc Skeletons): where the first second classes show up.
  - Map: orcsdun01
    Parties: { camp_orc: 1 }
    Levels: [40, 60]

  # Veins Field 03 (Magmarings): the party map, songs and SP more often than not. Players
  # level here from 95.
  - Map: ve_fild03
    Parties: { camp_leveling: 2 }
    Chance: { performer: 70, battery: 50 }
    Levels: [95, 110]

  # Geffen Field 06 (Petites): from 78 to 93.
  - Map: gef_fild06
    Parties: { camp_leveling: 1 }

  # Sograt Desert 17 (Hodes, Sandmen): from 55 to 70.
  - Map: moc_fild17
    Parties: { camp_leveling: 1 }
