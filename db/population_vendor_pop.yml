###########################################################################
# Population Engine Database — Vendor population
###########################################################################
#
# Job entries for shells that act as overhead-message vendors. VendorKey: names one
# shop in db/population_vendors.yml; nostalRE's VendorKeys: {key: weight, ...} lists
# several, and the merchant opens one by weight among the kinds the app allows.  Picked up by
# the VendorPlacement-driven autosummon pass for maps that have entries in
# db/population_vendors.yml (which configures the vendor inventory).
#
# Gear sets, profiles, and the arena job pool are defined in
# db/population_gear_sets.yml and shared across all three files.
#
###########################################################################

Header:
  Type: POPULATION_ENGINE_DB
  Version: 2

Body:

###########################################################################
# Profile - vendor shells.
###########################################################################

  - Profile: vendor_field_drops
    Jobs:
      Merchant    : para_merchant
      HighMerchant: para_merchant
    NameProfile: default
    Hair: [0, 42]
    HairColor: [0, 131]
    ClothesColor: [0, 699]
    Flags:
      - mortal
    TownBehavior: vendor
    # nostalRE: the shops a Merchant opens, by weight, among the kinds switched on
    VendorKeys:
      field_drops: 4
      potions: 1
      ammo_shop: 1
    Script: |
      setcart;

  - Profile: vendor_dungeon_drops
    Jobs:
      Blacksmith: para_merchant
      Whitesmith: para_merchant
    NameProfile: default
    Hair: [0, 42]
    HairColor: [0, 131]
    ClothesColor: [0, 699]
    Flags:
      - mortal
    TownBehavior: vendor
    VendorKeys:                     # nostalRE: a smith sells dungeon finds or forged gear
      dungeon_drops: 3
      equip_shop: 1
    Script: |
      setcart;

  # nostalRE: Alchemists brew what they sell
  - Profile: vendor_alchemist
    Jobs:
      Alchemist: para_merchant
      Creator  : para_merchant
    NameProfile: default
    Hair: [0, 42]
    HairColor: [0, 131]
    ClothesColor: [0, 699]
    Flags:
      - mortal
    TownBehavior: vendor
    VendorKeys:
      potions: 1
      buff_shop: 1
    Script: |
      setcart;
